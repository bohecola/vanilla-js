<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jotter · JS / TS 代码草稿纸</title>
    <script>
      /*
        首帧之前定下主题：React 挂载前 <html> 上没有 data-theme，
        会先按系统配色画一帧再跳变（默认是深色模式，浅色系统上就闪一下白）。
        这里同步读一次 localStorage 把 data-theme 补上。
        键名与默认值需与 src/theme/index.tsx 的 STORAGE_KEY / getInitialMode 保持一致。
      */
      (function () {
        var theme = 'dark'
        try {
          var saved = localStorage.getItem('playground-theme')
          var mode = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'dark'
          theme =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : mode
        } catch (e) {
          /* 隐私模式下 localStorage 可能抛错，退回默认深色 */
        }
        document.documentElement.setAttribute('data-theme', theme)

        /* 配色（蓝 / 粉 / 橙 / 绿）与 theme 同帧补上，避免配色切换后刷新先闪一帧蓝。
           键名与 src/theme/index.tsx 的 ACCENT_KEY / getInitialAccent 保持一致。 */
        var accent = 'blue'
        try {
          var savedAccent = localStorage.getItem('playground-accent')
          if (savedAccent === 'pink' || savedAccent === 'orange' || savedAccent === 'green') {
            accent = savedAccent
          }
        } catch (e) {
          /* 隐私模式下 localStorage 可能抛错，退回默认蓝 */
        }
        document.documentElement.setAttribute('data-accent', accent)
      })()

      /*
        同理，首帧之前定下语言：<html lang> 与标题在 React 挂载前就已经被读走（浏览器
        标签页、辅助技术、拼写检查都看它们），英文用户不该先看到一帧中文标题。

        html.lang 的取值、受支持的取值集合，与 src/i18n/context.ts 保持一致
        （context.ts 的 LANGS / langFromTag / readLangMode）。
        <html dir> 也在这里先定（阿拉伯语 rtl），否则 RTL 会闪一帧错方向。
        标题由运行期 dict 里的 html.title 兜底精确覆盖，这里只求首帧方向/语言不错。
      */
      ;(function () {
        var LANG_ATTR = {
          zh: 'zh-CN',
          zhHant: 'zh-Hant',
          en: 'en',
          fr: 'fr',
          de: 'de',
          it: 'it',
          ko: 'ko',
          ja: 'ja',
          vi: 'vi',
          pt: 'pt',
          ar: 'ar'
        }
        var TITLE = {
          'zh-CN': 'Jotter · JS / TS 代码草稿纸',
          en: 'Jotter · JS / TS scratchpad'
        }
        var mode = 'system'
        try {
          var saved = localStorage.getItem('jotter:lang')
          if (saved === 'system' || (saved && saved in LANG_ATTR)) mode = saved
        } catch (e) {
          /* 隐私模式下 localStorage 可能抛错，退回跟随系统 */
        }
        var sys = navigator.language || ''
        var primary = sys.split('-')[0].toLowerCase()
        function sysLang() {
          if (primary === 'zh') {
            var region = (sys.split('-')[1] || '').toUpperCase()
            return region === 'TW' || region === 'HK' || region === 'MO' ? 'zhHant' : 'zh'
          }
          if (primary === 'en') return 'en'
          if (primary === 'fr') return 'fr'
          if (primary === 'de') return 'de'
          if (primary === 'it') return 'it'
          if (primary === 'ko') return 'ko'
          if (primary === 'ja') return 'ja'
          if (primary === 'vi') return 'vi'
          if (primary === 'pt') return 'pt'
          if (primary === 'ar') return 'ar'
          return 'en'
        }
        var lang = mode === 'system' ? sysLang() : mode
        var attr = LANG_ATTR[lang] || 'en'
        document.documentElement.lang = attr
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
        document.title = TITLE[attr] || 'Jotter · JS / TS'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
