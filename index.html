<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jotter · JS / TS 代码草稿纸</title>
    <script>
      /*
        首帧之前定下主题：React 挂载前 <html> 上没有 data-theme，
        会先按系统配色画一帧再跳变（默认是深色模式，浅色系统上就闪一下白）。
        这里同步读一次 localStorage 把 data-theme 补上。
        键名与默认值需与 src/theme/index.tsx 的 STORAGE_KEY / getInitialMode 保持一致。
      */
      (function () {
        var theme = 'dark'
        try {
          var saved = localStorage.getItem('playground-theme')
          var mode = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'dark'
          theme =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : mode
        } catch (e) {
          /* 隐私模式下 localStorage 可能抛错，退回默认深色 */
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()

      /*
        同理，首帧之前定下语言：<html lang> 与标题在 React 挂载前就已经被读走（浏览器
        标签页、辅助技术、拼写检查都看它们），英文用户不该先看到一帧中文标题。

        标题的两句字面量在这里和 src/i18n/dict.zh.ts / dict.en.ts 各存一份 —— 首帧脚本
        必须是内联的，没法 import 字典。改标题要改三处。
        键名与三态的解析规则需与 src/i18n/context.ts 的 STORAGE_KEY / readLangMode /
        systemLang 保持一致。
      */
      ;(function () {
        var mode = 'system'
        try {
          var saved = localStorage.getItem('jotter:lang')
          if (saved === 'zh' || saved === 'en' || saved === 'system') mode = saved
        } catch (e) {
          /* 隐私模式下 localStorage 可能抛错，退回跟随系统 */
        }
        var lang = mode === 'system' ? (/^zh/i.test(navigator.language || '') ? 'zh' : 'en') : mode
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en'
        document.title =
          lang === 'zh' ? 'Jotter · JS / TS 代码草稿纸' : 'Jotter · JS / TS scratchpad'
      })()
    </script>
    <script type="module" crossorigin src="./assets/index-cNRXEANM.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B_SliFCl.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
