<!--
  Jotter 标记：折角的草稿页 + 两行字 + 停在旁边的光标。

  两个刻意的做法：
  1. 页面里的「文字」和「光标」是挖空的（fill-rule=evenodd，三个内圈子路径就是三个洞），
     不是填成深色。挖空处透出的是标签栏本身的颜色，浅色/深色标签栏下都自带对比，
     不用出两套图。
  2. 渐变的两端就是主题里原来那两支 logo 色：深色主题的 sky-400 和浅色主题的 sky-600。

  几何数据与 src/components/JotterMark.tsx 是同一份，改一处要改两处。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <linearGradient id="j" x1="8" y1="3" x2="24" y2="29" gradientUnits="userSpaceOnUse">
    <stop stop-color="#38bdf8" />
    <stop offset="1" stop-color="#0284c7" />
  </linearGradient>
  <path
    fill="url(#j)"
    fill-rule="evenodd"
    d="M8 3h11l8 8v15a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Z
       M10.7 15.6h4.6a1.7 1.7 0 0 1 0 3.4h-4.6a1.7 1.7 0 0 1 0-3.4Z
       M10.7 20.8h1.8a1.7 1.7 0 0 1 0 3.4h-1.8a1.7 1.7 0 0 1 0-3.4Z
       M21.3 14.2a1.7 1.7 0 0 1 1.7 1.7v7.6a1.7 1.7 0 0 1-3.4 0v-7.6a1.7 1.7 0 0 1 1.7-1.7Z"
  />
</svg>
